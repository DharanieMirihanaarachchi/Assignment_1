    <header><h1><center>Map of Kegalle</center></h1></header>



    <center><div id="map_space" style="width: 100%; height: 550px;"></div></center>
    <br>

    <script>
        function draw_map(){


            var loc = new google.maps.LatLng(7.246282837841179, 80.34174026631368);

            var loc2 = new google.maps.LatLng(7.249938318180187, 80.33610888465661);

            var myStyles = [{"featureType": "water",
                "elementType": "geometry.fill",
                "stylers": [{ "color": "#808080" }]
            },
            
            {"featureType": "administrative.localities",
                "elementType": "labels.text.fill",
                "stylers": [{ "color": "#ff0000" }]
            }]

        var roadsOffStyles = [
                {featureType: 'road',
                elementType: 'all',
                stylers: [{ visibility: 'off' }]} ,
                
                {featureType: 'administrative.locality',
                elementType: 'all',
                stylers: [{ lightness: 40 }, 
                { visibility: 'on' }]}
        ];

        
        var mapTypeControlOpts = {
            mapTypeIds: [
                google.maps.MapTypeId.ROADMAP,
                google.maps.MapTypeId.HYBRID,
                'mystyle',
                'roadsOff'
            ],
            position: google.maps.ControlPosition.TOP_RIGHT,
            style: google.maps.MapTypeControlStyle.DROPDOWN_MENU
        };



            var theMap = new google.maps.Map(document.getElementById("map_space"),{
                center: new google.maps.LatLng(7.247103357447327, 80.34226007698302),
                zoom: 15,
                mapTypeId : google.maps.MapTypeId.ROADMAP,
                zoomControl : true,
                zoomControlOptions: {
                    position: google.maps.ControlPosition.RIGHT_BOTTOM
                },
                streetViewControl: false,
                mapTypeControl: true,
                mapTypeControlOptions: mapTypeControlOpts,

            })

            var styledMapType = new google.maps.StyledMapType(myStyles,{
                    map: theMap,
                    name: 'Styled Map'
            });

            theMap.mapTypes.set('mystyle', styledMapType);

            var roadsOffMapType = new google.maps.StyledMapType(roadsOffStyles,{
                    map: theMap,
                    name: 'Roads Off'
            });

            theMap.mapTypes.set('roadsOff', roadsOffMapType);


                
            var flagshape = {
                coords: [1,2, 18,3, 18,14, 5,14, 5,24, 1,24],
                type: 'poly'
            }

            var image = 'flag.png';
            var mkr =  
            createMarker( loc, image,
                     '<a href="https://en.wikipedia.org/wiki/Millennium_Stadium">Principality Stadium</a>', theMap);


            var image2 = {
                url: 'beachflag.png',
                size: new google.maps.Size(20,34),
                origin: new google.maps.Point (0,0),
                anchor: new google.maps.Point(0,0)
            };

            
            var mkr2 = createMarker(loc2, image2,
                    '<a href="https://share.google/NTuCOCjEtDsde2xeg">My Primary School</a>', theMap);


            function createMarker(point,icon,info, map) {
               
                var markerOpts = {
                    position: point,
                    icon: icon,
                    map: map,
                    shape: flagshape

                };

                var marker = new google.maps.Marker(markerOpts);

                var infoWindowOpts = {content: info};
                
                var infoWindow = new google.maps.InfoWindow(infoWindowOpts);
                
                google.maps.event.addListener(marker, 'click', function() 
                    {
                        infoWindow.open(map,marker); 
                    }  
                );

                return marker;

        }





}


    </script>
    <script src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBido1XvtqvPYszA0lqAhWNEzbEpVunJwc&callback=draw_map"></script>
