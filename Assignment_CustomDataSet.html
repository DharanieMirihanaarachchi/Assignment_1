<div class="w3-sand w3-large">


    

<section class="w3-container" id="about">

  <div class="w3-content" style="max-width:700px">
<br>
    <header><h1><center>Thailand - Bangkok Railways, Cultural Places and Settlements</center></h1></header>
    <center><select id="mapSelect" style="width: 100%;">
        <option value="all">Show All</option>
        <option value="Railways">Railways</option>
        <option value="CulturalPlaces">Cultural Places</option>
        <option value="Settlements">Settlements</option>

    </select></center>

    <div id = "map_space"></div>


    <script>

        let theMap;
        let selected = "";

        function styleFeature(feature) {
            const dataset = feature.getProperty("dataset");
            
            let colour = "#808080";
            
            if (dataset === "Railways"){
                colour = "#FF0000"
            }
            if (dataset === "CulturalPlaces"){
                colour = "#0000FF"
            } 
            if (dataset === "Settlements"){
                colour = "yellow"
            }
            
            const showRow = (selected === "all" || dataset === selected);

            return{

                strokeColor: colour,
                strokeWeight: 3,

                fillColor: colour,
                fillOpacity: 0.3,

                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 7,
                    fillColor: colour,
                    fillOpacity: 1,
                    strokeColor: "#FFFFFF",
                    strokeWeight: 1
                },
                visible: showRow
            };
        }



        async function draw_map() {
            



        var map_options = {
            center: new google.maps.LatLng(13.753980, 100.501440),
            zoom: 13,
            mapTypeId:google.maps.MapTypeId.ROADMAP
        }

        theMap= new google.maps.Map(document.getElementById("map_space"), map_options);
        
        const infoWindow = new google.maps.InfoWindow();
      
        theMap.data.setStyle(styleFeature);

        const response = await fetch ("./railways.json");

        if(!response.ok){
            return;
        }

        const geojson = await response.json();
        theMap.data.addGeoJson(geojson)

        
        theMap.data.forEach(function(feature) {

            feature.setProperty("dataset", "Railways");

        });
  

        const response2 = await fetch ("./CulturalPlacesTh.json");

        if(!response2.ok){
            return;
        }

        const geojson2 = await response2.json();
        theMap.data.addGeoJson(geojson2)

        
        theMap.data.forEach(function(feature) {
        
            if (feature.getProperty("dataset") == null) {
                feature.setProperty("dataset", "CulturalPlaces");
            }         
        });

        const response3 = await fetch ("./Settlements.json");

        if(!response3.ok){
            return;
        }

        const geojson3 = await response3.json();
        theMap.data.addGeoJson(geojson3)

        
        theMap.data.forEach(function(feature) {
        
            if (feature.getProperty("dataset") == null) {
                feature.setProperty("dataset", "Settlements");
            }         
        });


    

        const SelOpt = document.getElementById("mapSelect");
        google.maps.event.addDomListener(SelOpt, "change", function(){
            selected = SelOpt.value;
            theMap.data.setStyle(styleFeature);
        });

      
        theMap.data.addListener("click", function (event) {
            const feature = event.feature;

            const name = feature.getProperty("name_en") || feature.getProperty("name") || feature.getProperty("name_th") || feature.getProperty("id");
            const clas = feature.getProperty("adm1_name") || feature.getProperty("amenity") || feature.getProperty("historic") || feature.getProperty("tourism") || feature.getProperty("landuse");
        

            infoWindow.setContent(
                "<h3>" + (name || "Unnamed") + "</h3>" + 
                "<p>Class: " + (clas || "Unknown Class") + "</p>"
            );

            infoWindow.setPosition(event.latLng);

            infoWindow.open({map: theMap});
        });
     



    
    }
        </script>
    <script src = "https://maps.googleapis.com/maps/api/js?key=AIzaSyBido1XvtqvPYszA0lqAhWNEzbEpVunJwc&callback=draw_map"></script>

</body>
